services:
  postgres:
    image: postgres:16-alpine
    container_name: aidev-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aidev}
      POSTGRES_USER: ${POSTGRES_USER:-aidev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aidev}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aidev} -d ${POSTGRES_DB:-aidev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ai-dev-migrations:
    build:
      context: ./persistence
      dockerfile: Dockerfile
    container_name: aidev-migrations
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-aidev}
      POSTGRES_USER: ${POSTGRES_USER:-aidev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aidev}
    depends_on:
      postgres:
        condition: service_healthy

  ai-dev-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: aidev-api
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-aidev}
      POSTGRES_USER: ${POSTGRES_USER:-aidev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aidev}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET must be set}
    ports:
      - "8000:8000"
    depends_on:
      ai-dev-migrations:
        condition: service_completed_successfully

  ai-dev-executor:
    build:
      context: .
      dockerfile: executor/Dockerfile
    container_name: aidev-executor
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-aidev}
      POSTGRES_USER: ${POSTGRES_USER:-aidev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aidev}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-python:3.12-slim}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      ai-dev-migrations:
        condition: service_completed_successfully

volumes:
  postgres_data:

name: Build & Test

on:
  push:
    branches: [ main, master, "feature/**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aidev
          POSTGRES_USER: aidev
          POSTGRES_PASSWORD: aidev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./api[dev]
          pip install -e ./persistence[dev]
          pip install -e ./executor[dev]

      - name: Run Pytest Test Suite
        env:
          TEST_DATABASE_URL: postgresql+psycopg://aidev:aidev@localhost:5432/aidev
          GITHUB_WEBHOOK_SECRET: test_secret_key_for_ci
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: aidev
          POSTGRES_USER: aidev
          POSTGRES_PASSWORD: aidev
        run: |
          pytest --verbose

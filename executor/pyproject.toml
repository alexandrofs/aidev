[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dev-executor"
version = "0.1.0"
description = "Ephemeral Docker Sandbox Executor Worker for AI Developer"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "docker>=7.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg>=3.1.0",
    "psycopg-binary>=3.1.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "../tests"]
python_files = "test_*.py"
pythonpath = ["src", ".."]
asyncio_mode = "auto"
